name: ota_i18n_louis
description: A robust, type-safe, and framework-agnostic Over-The-Air (OTA) internationalization solution for Flutter.
version: 1.0.0
homepage: https://github.com/hiimBugCreator/ota_i18n_louis
repository: https://github.com/hiimBugCreator/ota_i18n_louis.git
issue_tracker: https://github.com/hiimBugCreator/ota_i18n_louis/issues

topics:
  - i18n
  - localization
  - ota
  - flutter
  - internationalization

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: '>=1.17.0'

executables:
  ota_builder: ota_i18n_builder

dependencies:
  flutter:
    sdk: flutter
  meta: ^1.11.0
  args: ^2.4.2
  dart_style: ^2.3.2
  path: ^1.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
